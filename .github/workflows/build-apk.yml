name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: | rm -rf www && mkdir www cp index.html style.css app.js i18n.js manifest.webmanifest www/ cp -r icons www/icons 
      - name: Add Android platform
        run: npx cap add android

      - name: Apply Android overrides (print + camera)
        run: bash scripts/android-setup.sh

      - name: Generate launcher icons
        run: npx --yes @capacitor/assets generate --android || echo "icons skipped"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: | chmod +x gradlew ./gradlew assembleDebug --no-daemon 
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ALSCIF-Carburant.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALSCIF-Carburant-apk
          path: ALSCIF-Carburant.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "APK v1.0.${{ github.run_number }}"
          body: | 📱 **تحميل مباشر:** نزّل `ALSCIF-Carburant.apk` من "Assets" تحت، وثبّتو ف التليفون. (إذا طلب منك الأندرويد، فعّل "السماح بالتثبيت من هذا المصدر".)           files: ALSCIF-Carburant.apk
